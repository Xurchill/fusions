<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cássio Fróis — Fusions Engenharia</title>
<meta name="description" content="Cartão de visita digital — Cássio Fróis, Fusions Engenharia">
<style>
  :root{
    --bg:#0a0b0d; --card:#15161a; --line:#2a2b30; --txt:#f5f1e8; --sub:#a79e8c;
    --goldA:#f0d58a; --goldB:#b8893a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1100px 520px at 50% -150px, #2a2113 0%, rgba(10,11,13,0) 62%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;justify-content:center;
    padding:46px 16px calc(40px + env(safe-area-inset-bottom));
  }
  .card{width:100%;max-width:420px;text-align:center}
  .logo{width:230px;max-width:72%;height:auto;margin:0 auto;display:block;
    filter:drop-shadow(0 8px 26px rgba(184,137,58,.28))}
  h1{font-size:26px;margin:22px 0 4px;font-weight:800;letter-spacing:.2px}
  .sub{color:var(--sub);font-size:14px;margin:0;letter-spacing:2px;text-transform:uppercase;font-weight:600}
  .rule{width:54px;height:2px;margin:16px auto 0;border-radius:2px;
    background:linear-gradient(90deg,var(--goldA),var(--goldB))}
  .actions{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:16px;text-decoration:none;border-radius:16px;
    padding:16px 18px;font-size:16px;background:var(--card);border:1px solid var(--line);
    color:var(--txt);transition:transform .06s ease,border-color .2s ease}
  a.btn:active{transform:scale(.99)}
  a.btn:hover{border-color:#4a442f}
  a.btn .ic{flex:0 0 26px;height:26px;display:flex;align-items:center;justify-content:center}
  a.btn .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
  a.btn .tx b{font-weight:700}
  a.btn .tx span{color:var(--sub);font-size:13px}
  a.save{justify-content:center;font-weight:800;font-size:17px;border:none;
    background:linear-gradient(135deg,var(--goldA),var(--goldB));color:#1a1203}
  a.save .ic{flex-basis:24px}
  .foot{margin-top:26px;color:#5b5443;font-size:12px;letter-spacing:1px}
  svg{display:block}
</style>
</head>
